[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
autorestart=true
priority=10
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err

[program:fluxbox]
command=fluxbox -display :99
environment=DISPLAY=":99"
autorestart=true
priority=20
stdout_logfile=/var/log/fluxbox.log
stderr_logfile=/var/log/fluxbox.err

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900 -nopw
autorestart=true
priority=30
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.err

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=40
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.err

[program:api]
command=python3 -m uvicorn api_server:app --host 127.0.0.1 --port 8000
directory=/app
environment=DISPLAY=":99",PYTHONUNBUFFERED="1"
autorestart=true
priority=50
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.err

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=60
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx.err
