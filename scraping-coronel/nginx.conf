events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Map para soporte adecuado de WebSocket Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Mapas de autorización de seguridad para noVNC y WebSockets
    map $arg_token $token_auth {
        "jgstore_scraper_secure_token_2026" 1;
        default 0;
    }

    map $cookie_vnc_token $cookie_auth {
        "jgstore_scraper_secure_token_2026" 1;
        default 0;
    }

    map $http_referer $referer_auth {
        ~*press-cloud\.com 1;
        ~*localhost 1;
        ~*127\.0\.0\.1 1;
        default 0;
    }

    map "$token_auth:$cookie_auth:$referer_auth" $is_vnc_authorized {
        "~1" 1;
        default 0;
    }

    server {
        listen 80;
        server_name _;

        # Raíz: Redirección automática a la tienda principal protegida
        location = / {
            return 302 https://jg-store.press-cloud.com;
        }

        # Interfaz web de noVNC (HTML, JS, CSS, assets)
        location /vnc/ {
            if ($is_vnc_authorized = 0) {
                return 403 "Acceso denegado: Token de seguridad o autorizacion requerida.";
            }

            if ($arg_token = "jgstore_scraper_secure_token_2026") {
                add_header Set-Cookie "vnc_token=jgstore_scraper_secure_token_2026; Path=/; SameSite=None; Secure" always;
            }

            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # WebSocket endpoint de noVNC / websockify (sin slash final para preservar URI)
        location /websockify {
            if ($is_vnc_authorized = 0) {
                return 403 "Acceso denegado: Token de seguridad o autorizacion requerida.";
            }

            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Soporte para /vnc/websockify
        location /vnc/websockify {
            if ($is_vnc_authorized = 0) {
                return 403 "Acceso denegado: Token de seguridad o autorizacion requerida.";
            }

            proxy_pass http://127.0.0.1:6080/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # API REST y SSE del Scraper
        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Clave para streaming SSE sin buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # Healthcheck
        location /health {
            proxy_pass http://127.0.0.1:8000/health;
        }
    }
}
