events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Map para soporte adecuado de WebSocket Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # Raíz: Redirección automática a la tienda principal protegida
        location = / {
            return 302 https://jg-store.press-cloud.com;
        }

        # Interfaz web de noVNC - Requiere token de seguridad para ser embebida
        location /vnc/ {
            if ($arg_token != "jgstore_scraper_secure_token_2026") {
                return 403 "Acceso denegado: Token de seguridad requerido.";
            }
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # WebSocket endpoint de noVNC / websockify
        location /websockify {
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # API REST y SSE del Scraper
        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Clave para streaming SSE sin buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # Healthcheck
        location /health {
            proxy_pass http://127.0.0.1:8000/health;
        }
    }
}
